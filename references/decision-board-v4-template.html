<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT 视觉决策板 V4.1</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf7ff;
      --paper: #ffffff;
      --paper-2: #e5f0fb;
      --ink: #183452;
      --muted: #526f8b;
      --line: #bfd5e8;
      --accent: #247bee;
      --accent-soft: #eaf4ff;
      --accent-2: #5ab2e5;
      --dark: #174c89;
      --ok: #258078;
      --warn: #b16c27;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 9% 0%, #d7f2ff 0, transparent 35%), radial-gradient(circle at 95% 16%, #ddecff 0, transparent 33%), var(--bg); color: var(--ink); }
    button, input, textarea { font: inherit; }
    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .14s, box-shadow .14s, background .14s, border-color .14s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(30, 105, 183, .12); }
    button:active { transform: translateY(0); box-shadow: none; }
    h1, h2, h3, h4 { letter-spacing: 0; }
    h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.18; }
    h2 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.2;
      color: var(--ink);
    }
    h3 { margin: 0 0 10px; font-size: 19px; line-height: 1.25; }
    h4 { margin: 0 0 6px; font-size: 14px; line-height: 1.25; }
    p { margin: 5px 0; color: var(--muted); line-height: 1.48; font-size: 13px; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 14px 22px;
      background: rgba(246, 251, 255, .9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .primary { background: linear-gradient(135deg, #318cf4, #1769dc); color: white; padding: 11px 18px; font-weight: 800; box-shadow: 0 7px 16px rgba(36, 123, 238, .2); }
    .secondary, .quiet { border: 1px solid #91b6d6; background: #f7fbff; color: #174c89; padding: 10px 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(23, 76, 137, .08); }
    .secondary:hover, .quiet:hover { border-color: #5f9ed2; background: #e7f3ff; box-shadow: 0 3px 8px rgba(23, 76, 137, .13); }
    .page { max-width: 1480px; margin: 0 auto; padding: 24px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 12px 30px rgba(37, 105, 166, .07), 0 2px 8px rgba(37, 105, 166, .04);
      padding: 26px;
    }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--dark);
    }
    .section-title h2 { margin: 0; }
    .global-title h2 {
      margin-top: 2px;
      font-size: clamp(30px, 2.5vw, 42px);
      line-height: 1.06;
      letter-spacing: -0.03em;
      font-weight: 950;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--dark);
      color: #fff8ef;
      font-size: 12px;
      font-weight: 800;
    }
    .global-grid { display: grid; gap: 14px; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .category-tabs {
      display: flex;
      gap: 10px;
      margin: 8px 0 14px;
      flex-wrap: wrap;
    }
    .category-tab {
      min-height: 42px;
      padding: 9px 16px;
      background: #eee7dd;
      color: var(--ink);
      font-weight: 900;
    }
    .category-tab.selected {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 18px rgba(200, 100, 43, .18);
    }
    .triad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .mini-module {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
    }
    .mini-module h3 { font-size: 15px; margin-bottom: 9px; }
    .wide-choice-module {
      margin-top: 10px;
    }
    .wide-choice-module .choice-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }
    .choice-row { display: grid; gap: 7px; }
    .choice {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #f6eee3;
      color: var(--ink);
      text-align: left;
    }
    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .choice strong { display: block; font-size: 13px; }
    .choice span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .card-option {
      min-height: 118px;
      padding: 12px;
      border: 1px solid var(--line);
      background: #fffaf1;
      color: var(--ink);
      text-align: left;
    }
    .card-option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .swatches { display: flex; gap: 6px; margin: 8px 0; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: var(--ink);
      padding: 8px 10px;
    }
    textarea {
      min-height: 38px;
      height: 38px;
      line-height: 1.35;
      resize: vertical;
      overflow: auto;
      margin-top: 12px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 16px;
      margin-top: 16px;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      display: grid;
      gap: 12px;
    }
    .side .panel { padding: 16px; }
    .progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e2d8cc;
      margin: 10px 0 12px;
    }
    .progress span { display: block; height: 100%; width: 0%; background: var(--accent); }
    .nav-button {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr 10px;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      margin: 6px 0;
      padding: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink);
      text-align: left;
    }
    .nav-button.active { background: var(--accent-soft); border-color: rgba(200, 100, 43, .45); }
    .nav-index {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--dark);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }
    .nav-title { font-weight: 900; font-size: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
    .dot.ok { background: var(--ok); }
    .slide-panel { scroll-margin-top: 92px; }
    .slide-hero {
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2c261f, #4b3326);
      color: white;
    }
    .slide-hero h2 { color: white; font-size: 28px; margin: 0 0 6px; }
    .slide-hero p { color: rgba(255, 248, 239, .78); }
    .content-group {
      padding: 22px 0;
      border-top: 1px solid #e4dacf;
    }
    .content-group:first-of-type { border-top: 0; padding-top: 0; }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .raw-group-head { align-items: center; flex-wrap: wrap; }
    .raw-group-head h3 { margin: 0; }
    .raw-head-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .raw-actions, .raw-tabs { display: flex; align-items: center; gap: 7px; }
    .raw-action { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 11px; font-size: 12px; font-weight: 700; }
    .raw-action.quiet { border: 1px solid #7fa8ca; background: #fff; color: #174c89; }
    .raw-action.secondary { border: 1px solid #6b9bc2; background: #e9f3fc; color: #174c89; }
    .raw-action svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .raw-action:disabled { opacity: .48; cursor: not-allowed; transform: none; box-shadow: none; }
    .raw-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 10px 0 0; }
    .raw-tabs { margin: 0; }
    .raw-tab { border-radius: 7px 7px 0 0; padding: 7px 12px; background: transparent; color: #567895; box-shadow: none; }
    .raw-tab:hover { transform: none; background: #edf6ff; box-shadow: none; }
    .raw-tab.active { color: #155c9f; background: #e7f3ff; box-shadow: inset 0 -2px #2582df; }
    .raw-sync-status { min-height: 18px; margin: 0 0 0 auto; color: #527494; font-size: 12px; text-align: right; }
    .raw-sync-status[data-state="dirty"] { color: #986112; }
    .raw-sync-status[data-state="error"] { color: #b42318; }
    .raw-preview, .raw-editor { width: 100%; min-height: 208px; height: 260px; max-height: 65vh; margin-top: 8px; overflow: auto; resize: vertical; border: 1px solid #cbdff0; border-radius: 10px; background: #fff; padding: 13px 15px; color: #173c60; line-height: 1.65; }
    .raw-preview { display: block; }
    .raw-editor { display: none; resize: vertical; white-space: pre-wrap; font-family: ui-monospace, Consolas, "Microsoft YaHei UI", monospace; font-size: 13px; }
    .raw-preview h1, .raw-preview h2, .raw-preview h3, .raw-preview h4 { margin: 12px 0 7px; color: #153f68; line-height: 1.35; }
    .raw-preview h1 { font-size: 20px; } .raw-preview h2 { font-size: 18px; } .raw-preview h3 { font-size: 16px; } .raw-preview h4 { font-size: 14px; }
    .raw-preview p, .raw-preview ul, .raw-preview ol, .raw-preview blockquote, .raw-preview pre, .raw-preview table { margin: 7px 0 12px; }
    .raw-preview ul, .raw-preview ol { padding-left: 24px; }
    .raw-preview li { margin: 3px 0; }
    .raw-preview blockquote { padding: 7px 12px; border-left: 3px solid #71aee3; background: #f0f7fd; color: #456786; }
    .raw-preview code { padding: 1px 4px; border-radius: 4px; background: #e9f2fa; font-family: ui-monospace, Consolas, monospace; }
    .raw-preview pre { overflow: auto; padding: 10px; border-radius: 7px; background: #eef4f9; }
    .raw-preview pre code { padding: 0; background: none; }
    .raw-preview table { width: 100%; border-collapse: collapse; }
    .raw-preview th, .raw-preview td { padding: 6px 8px; border: 1px solid #cfdfec; text-align: left; vertical-align: top; }
    .raw-preview th { background: #eaf4fc; }
    .hint { color: var(--muted); font-size: 12px; }
    .decision-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .mode-card {
      min-height: 158px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: var(--ink);
      text-align: left;
    }
    .mode-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .mode-meta {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(214, 204, 191, .78);
    }
    .mode-meta span,
    .weight-summary span {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(29, 107, 120, .1);
      color: #245865;
      font-size: 12px;
      font-weight: 800;
    }
    .weight-table {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .weight-row {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) 2.4fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border: 1px solid #eadfd2;
      border-radius: 8px;
      background: rgba(255, 250, 241, .72);
    }
    .weight-name {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
    }
    .weight-title-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .weight-title-group h3 { margin: 0; }
    .weight-help { position: relative; z-index: 4; flex: 0 0 auto; }
    .weight-help > summary { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid #7fa8ca; border-radius: 50%; background: #fff; color: #245d91; font-size: 13px; font-weight: 800; line-height: 1; cursor: pointer; list-style: none; }
    .weight-help > summary::-webkit-details-marker { display: none; }
    .weight-help > summary:hover { background: #e7f3ff; border-color: #4e8fc8; }
    .weight-help > summary:focus-visible { outline: 3px solid #75b8f4; outline-offset: 2px; }
    .weight-help-popover { position: absolute; top: calc(100% + 8px); left: -4px; display: none; width: min(390px, calc(100vw - 48px)); gap: 10px; padding: 14px 16px; border: 1px solid #9bbbd7; border-radius: 10px; background: #fff; box-shadow: 0 12px 28px rgba(23, 76, 137, .2); color: #183452; }
    .weight-help[open] .weight-help-popover { display: grid; }
    .weight-help-item { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: start; font-size: 12px; line-height: 1.5; }
    .weight-help-item strong { color: #174c89; }
    .weight-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }
    .weight-option {
      min-height: 36px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f5efe7;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      box-shadow: none;
    }
    .weight-option:hover { transform: none; box-shadow: none; }
    .weight-option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #111;
    }
    .weight-summary {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .visual-card {
      padding: 12px;
      min-height: 178px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: var(--ink);
      text-align: left;
    }
    .visual-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .review-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }
    .question-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 250, 241, .72);
      margin-top: 12px;
    }
    .question-options-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .radio-choice {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f5efe7;
      color: var(--ink);
      text-align: left;
      box-shadow: none;
    }
    .radio-choice:hover { transform: none; box-shadow: none; }
    .radio-choice.selected { border-color: var(--accent); background: var(--accent-soft); color: #111; }
    .asset-zone {
      border: 1px dashed #bdae9e;
      border-radius: 8px;
      background: rgba(255,255,255,.46);
      padding: 16px;
      margin-bottom: 14px;
    }
    .asset-zone.drag {
      border-color: var(--accent);
      background: #fff5eb;
      box-shadow: 0 0 0 2px rgba(200,100,43,.12);
    }
    .asset-paste-target {
      min-height: 58px;
      display: grid;
      place-items: center;
      margin-top: 12px;
      border: 1px dashed #d2c3b2;
      border-radius: 8px;
      background: #fffaf1;
      color: var(--muted);
      font-size: 13px;
    }
    .asset-paste-target:focus,
    .asset-paste-target.drag {
      outline: 3px solid rgba(200,100,43,.18);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .asset-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .asset-records { color: var(--ok); font-size: 12px; margin-top: 7px; }
    .asset-type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .compact-toggle {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f6eee3;
    }
    .toggle-option {
      min-height: 32px;
      padding: 6px 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      box-shadow: none;
    }
    .toggle-option:hover { transform: none; box-shadow: none; }
    .toggle-option.selected { background: var(--accent); color: white; }
    .chip {
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f2eadf;
      color: var(--muted);
      font-size: 12px;
      box-shadow: none;
    }
    .chip:hover { transform: none; box-shadow: none; }
    .chip.selected { background: #2e4f5d; border-color: #2e4f5d; color: white; }
    .inline-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    .subsection {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eadfd2;
    }
    .subsection:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }
    .supplement {
      margin-top: 16px;
    }
    .risk-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .risk-list li { color: var(--muted); font-size: 13px; line-height: 1.42; }
    .risk { color: var(--warn); font-weight: 900; }
    .ok { color: var(--ok); font-weight: 900; }
    .output { display: none; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(22, 18, 14, .42);
    }
    .modal.active { display: grid; }
    .modal-card { width: min(560px, 100%); padding: 22px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
    .asset-record { display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap; }
    .asset-record img { width:64px; height:48px; object-fit:cover; border-radius:4px; }
    /* Light blue review surface: quiet defaults, clear selected controls, generous spacing. */
    header { padding: 17px 28px; border-bottom-color: #cfe4f6; box-shadow: 0 4px 20px rgba(36, 105, 172, .05); }
    header h1 { color: #143b68; }
    header p { margin-top: 6px; }
    .top-actions { gap: 12px; }
    .status-pill { background: #f2f9ff; border-color: #cde4f7; color: #416b91; }
    .page > .panel { background: linear-gradient(145deg, #ffffff 45%, #f0f9ff); }
    .section-title { border-bottom: 1px solid #d8e9f7; padding-bottom: 16px; margin-bottom: 18px; }
    .section-title.page-review-title { border-bottom: 0; padding-bottom: 0; margin-bottom: 10px; }
    .eyebrow { background: #e7f3ff; color: #2269b5; letter-spacing: .04em; }
    .global-grid { gap: 20px; }
    .category-tabs { gap: 8px; margin: 12px 0 18px; }
    .category-tab { background: #edf6ff; color: #3a658b; border: 1px solid #d6e8f7; border-radius: 999px; }
    .category-tab.selected { background: #247bee; border-color: #247bee; box-shadow: 0 7px 16px rgba(36, 123, 238, .18); }
    .mini-module, .question-card, .weight-row { background: #eaf2f9; border-color: #b9d0e4; border-radius: 13px; }
    .mini-module { padding: 18px; }

<body>
  <header>
    <div>
      <h1 id="boardTitle">PPT 视觉决策板 V4.1</h1>
      <p>全局风格独立确认；Slide 审阅区只由左侧进度导航统领，点击页签会回到对应页面顶部。</p>
    </div>
    <div class="top-actions">
      <span class="status-pill" id="saveStatus" role="status" aria-live="polite">未保存</span>
      <button class="secondary" id="copyJson" hidden>复制 JSON</button>
      <button class="primary" id="saveJson">完成审阅并保存</button>
    </div>
  </header>

  <div class="page">
    <section class="panel" id="globalPanel"></section>

    <section class="workspace">
      <aside class="side">
        <section class="panel">
          <h3>审阅进度</h3>
          <div class="progress"><span id="progressBar"></span></div>
          <p id="progressText">0 / 6 页已检查</p>
          <div id="slideNav"></div>
        </section>
        <section class="panel">
          <h3>全局摘要</h3>
          <ul class="risk-list" id="globalSummary"></ul>
        </section>
      </aside>

      <main id="slidePanel" class="slide-panel"></main>
    </section>
  </div>

  <textarea class="output" id="decisionOutput" spellcheck="false"></textarea>

  <div class="modal" id="savedModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle">审阅状态</h2>
      <p id="modalText">接下来可以生成 Master_Template.md 与 PPT_Page_Image_Guide.md。</p>
      <button class="primary" id="closeModal">知道了</button>
    </div>
  </div>

  <script src="./common-options.js"></script>
  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`未能加载脚本：${src}`));
        document.head.appendChild(script);
      });
    }

    async function loadBoardData() {
      const isFileMode = window.location.protocol === 'file:';
      if (isFileMode) {
        try {
          await loadScript('./board-inline-data.js');
          const inlineData = window.__BOARD_DATA__ || null;
          if (inlineData) return inlineData;
        } catch (error) {}
      } else {
        try {
          const response = await fetch('./board-data.json', { cache: 'no-store' });
          if (response.ok) return await response.json();
        } catch (error) {}
      }
      throw new Error('未能加载 board-data.json 或 board-inline-data.js');
    }

    function applyBoardMetadata(boardData) {
      const projectName = typeof boardData.projectName === 'string'
        ? boardData.projectName
        : (boardData.projectName?.title || boardData.projectName?.name || 'PPT 项目');
      const title = `${projectName} PPT 视觉决策板 V4.1`;
      document.title = title;
      const titleNode = document.getElementById('boardTitle');
      if (titleNode) titleNode.textContent = title;
      const progressNode = document.getElementById('progressText');
      if (progressNode) progressNode.textContent = `0 / ${boardData.slides.length} 页已检查`;
    }

    function cloneBoardData(boardData) {
      return JSON.parse(JSON.stringify(boardData));
    }

    async function bootstrap() {
      const loaded = await loadBoardData();
      const boardData = cloneBoardData(loaded);
      applyBoardMetadata(boardData);

      const PROJECT_NAME = typeof boardData.projectName === 'string'
        ? boardData.projectName
        : (boardData.projectName?.title || boardData.projectName?.name || 'PPT 项目');
      const palettes = boardData.palettes;
      const decisionBoardCommonOptions = window.__DECISION_BOARD_COMMON_OPTIONS__;
      if (!decisionBoardCommonOptions) {
        throw new Error('未能加载 common-options.js');
      }
      const {
        paletteCategoryLabels,
        globalControls,
        organizationOptions,
        commonOptions,
        weightOptions,
        emphasisMethods,
        imageTypes,
        legacyGlobalPaletteKeys: LEGACY_GLOBAL_PALETTE_KEYS
      } = decisionBoardCommonOptions;

      const slides = boardData.slides;
      const sourceDocument = boardData.sourceDocument || null;
      const sourcePages = {};
      const sourceFeedback = {};
      const rawDirty = new Set();
      let sourceDocumentAvailable = false;
      if (sourceDocument && window.location.protocol !== 'file:') {
        try {
          const response = await fetch('/api/source-document', { cache: 'no-store' });
          if (response.ok) {
            const data = await response.json();
            Object.assign(sourcePages, data.pages || {});
            sourceDocumentAvailable = true;
          }
        } catch (error) {}
      }

      const state = {
        active: boardData.initialActive || slides[0]?.id || 'slide01',
        palette_category: 'dark',
        palette_direction: 'deep-navy-signal-gold',
        title_overlay: 'overlay-title',
        content_handling: null,
        global_notes: '',
        global_palette_notes: '',
        raw_materials: Object.fromEntries(slides.map(slide => [slide.id, slide.raw])),
        slides: {}
      };

    function initState() {
      slides.forEach(slide => {
        const mode = commonOptions.page_mode.find(item => item.id === (slide.defaultMode || 'module-structure')) || commonOptions.page_mode[1];
        const groupWeights = Object.fromEntries(getInformationGroups(slide).map(group => [group.id, normalizeGroupWeight(group.defaultWeight || 'secondary')]));
        state.slides[slide.id] = {
          title: slide.title,
          page_mode: mode.id,
          primary_emphasis_method: slide.defaultPrimaryEmphasisMethod || 'reading-priority',
          visual_direction: slide.visualDirections[0].id,
          expression_mode: 'realistic-scene',
          visual_strength: mode.visual_strength,
          visual_restraint: 'cinematic',
          visual_expressiveness: slide.defaultVisualExpressiveness || 'polished-enhanced',
          expressive_mechanism: slide.defaultExpressiveMechanism || deriveExpressiveMechanism(slide, slide.defaultVisualExpressiveness || 'polished-enhanced'),
          density: mode.density,
          page_treatment: mode.page_treatment,
          information_groups: getInformationGroups(slide),
          group_weights: groupWeights,
          checked: false,
          locked_text: [...slide.locked],
          custom_locked_text: [],
          section_title_candidates: [...slide.sectionTitles],
          required_section_titles: [...slide.sectionTitles],
          review_answers: Object.fromEntries(slide.questions.map(q => [q.id, q.choices[0]])),
          real_images: Object.fromEntries(slide.assets.map(a => [a.id, []])),
          real_image_types: Object.fromEntries(slide.assets.map(a => [a.id, 'skip'])),
          visual_direction_notes: '',
          density_notes: '',
          page_treatment_notes: '',
          design_notes: '',
          section_structure_notes: '',
          real_image_notes: '',
          page_notes: ''
        };
      });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function escapeMarkdownHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderMarkdownInline(value) {
      let text = escapeMarkdownHtml(value);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>');
      text = text.replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/_(.+?)_/g, '<em>$1</em>');
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return text;
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
      const html = [];
      const isBlockStart = line => /^\s*(?:#{1,6}\s|```|[-*+]\s|\d+[.)]\s|>\s?|(?:---+|\*\*\*+)\s*$)/.test(line);
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        const fence = line.match(/^\s*```\s*([\w-]*)/);
        if (fence) {
          const code = []; i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
          if (i < lines.length) i++;
          html.push(`<pre><code>${escapeMarkdownHtml(code.join('\n'))}</code></pre>`); continue;
        }
        const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) { const level = heading[1].length; html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`); i++; continue; }
        if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) { html.push('<hr>'); i++; continue; }
        if (i + 1 < lines.length && line.includes('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
          const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
          const headers = cells(line); i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
          const head = `<thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead>`;
          const body = `<tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody>`;
          html.push(`<table>${head}${body}</table>`); continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) items.push(`<li>${renderMarkdownInline(lines[i++].replace(/^\s*[-*+]\s+/, ''))}</li>`);
          html.push(`<ul>${items.join('')}</ul>`); continue;
        }
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(`<li>${renderMarkdownInline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`);
          html.push(`<ol>${items.join('')}</ol>`); continue;
        }
        if (/^\s*>/.test(line)) {
          const quote = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(renderMarkdownInline(lines[i++].replace(/^\s*>\s?/, '')));
          html.push(`<blockquote>${quote.join('<br>')}</blockquote>`); continue;
        }
        const paragraph = [line]; i++;
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i]) && !(lines[i].includes('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || ''))) paragraph.push(lines[i++]);
        html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
      }
      return html.join('');
    }

    async function postJson(url, body) {
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '操作失败');
      return result;
    }

    function getInformationGroups(slide) {
      if (slide.informationGroups && slide.informationGroups.length) return slide.informationGroups;
      return slide.sectionTitles.map((title, index) => ({
        id: 'section_' + index,
        label: title,
        defaultWeight: index === 0 ? 'primary' : 'secondary'
      }));
    }

    function normalizeGroupWeight(weight) {
      if (weight === 'supporting' || weight === 'light') return 'graphic';
      return weightOptions.some(option => option.id === weight) ? weight : 'secondary';
    }

    function normalizeGroupWeights(slideState) {
      slideState.group_weights ||= {};
      const hadLegacyWeight = Object.values(slideState.group_weights).some(weight => weight === 'supporting' || weight === 'light');
      for (const [groupId, weight] of Object.entries(slideState.group_weights)) {
        slideState.group_weights[groupId] = normalizeGroupWeight(weight);
      }
      for (const group of slideState.information_groups || []) {
        if (!slideState.group_weights[group.id]) slideState.group_weights[group.id] = normalizeGroupWeight(group.defaultWeight || 'secondary');
      }
      if (hadLegacyWeight && slideState.checked && slideState._checked_signature) slideState._checked_signature = reviewSignature(slideState);
    }

    function applyPageMode(slideState, modeId) {
      const mode = commonOptions.page_mode.find(item => item.id === modeId) || commonOptions.page_mode[1];
      slideState.page_mode = mode.id;
      slideState.density = mode.density;
      slideState.page_treatment = mode.page_treatment;
    }

    function deriveCreativeExtensionLevel(visualExpressiveness) {
      return {
        'restrained-professional': 'strict-source',
        'polished-enhanced': 'semantic-extended',
        'high-impact': 'expressive-metaphor'
      }[visualExpressiveness || 'polished-enhanced'] || 'semantic-extended';
    }

    function deriveExpressiveMechanism(slide, visualExpressiveness) {
      const text = [slide.title, slide.role, slide.summary, slide.raw, ...(slide.sectionTitles || [])].join(' ');
      if (/证据|数据|截图|参数|样本|对比|指标|表格|评测|验证/.test(text)) return 'evidence-wall';
      if (/流程|路径|链路|阶段|步骤|输入|输出|转化|闭环/.test(text)) return 'narrative-path';
      if (/系统|平台|控制|调度|座舱|监控|界面|后台/.test(text)) return 'system-cockpit';
      if (/差异|竞品|对照|缺口|前后|传统|自研|升级/.test(text)) return 'contrast-stage';
      if (/产品|设备|硬件|终端|模块|镜头|屏幕|引擎|算法/.test(text)) return visualExpressiveness === 'high-impact' ? 'hero-detail' : 'object-metaphor';
      return visualExpressiveness === 'restrained-professional' ? 'material-editorial' : 'scene-depth';
    }

    function renderGlobal() {
      const panel = document.getElementById('globalPanel');
      panel.innerHTML = `
        <div class="section-title global-title">
          <div><span class="eyebrow">GLOBAL</span><h2>全局风格</h2></div>
          <span class="hint">先定全局，Slide 区只做逐页表达</span>
        </div>
        <div class="global-grid">
          <div>
            <h3>色系方向</h3>
            <div class="category-tabs" id="paletteCategoryTabs"></div>
            <div class="palette-grid" id="paletteGrid"></div>
            <textarea id="globalPaletteNotes" placeholder="全局色系补充（一行即可）"></textarea>
          </div>
          <div>
            <h3>原始内容处理方式</h3>

        button.type = 'button';
        button.innerHTML = `<span class="nav-index">${String(index + 1).padStart(2, '0')}</span><span class="nav-title">${slide.title}</span><span class="nav-status-dot${s.checked ? ' checked' : ''}" aria-hidden="true"></span>`;
        button.setAttribute('aria-label', `${slide.title}，${s.checked ? '已检查' : '待检查'}`);
        button.title = s.checked ? '已检查' : '待检查';
        button.addEventListener('click', () => {
          state.active = slide.id;
          renderAll(true);
        });
        const review = el('button', 'nav-review');
        review.innerHTML = s.checked
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.4 4.2L19 7.5"/></svg>';
        review.type = 'button';
        review.setAttribute('aria-label', `${slide.title}：${s.checked ? '取消已审阅' : '标记为已审阅'}`);

    function rawBlock(slide) {
      const wrap = el('div', 'content-group raw-material-group');
      const head = el('div', 'group-head raw-group-head');
      const heading = el('h3', '', '本页原始材料');
      const tools = el('div', 'raw-head-tools');
      const fileHint = el('span', 'hint', sourceDocument?.name ? `关联决策版本：${sourceDocument.name}` : '未关联决策版本文档');
      const actions = el('div', 'raw-actions');
      const makeAction = (id, label, tone, pathData) => {
        const button = el('button', `raw-action ${tone}`, label);
        button.type = 'button';
        button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${pathData}"></path></svg><span>${label}</span>`;
        button.setAttribute('aria-label', label);
        button.disabled = !sourceDocumentAvailable;
        button.dataset.action = id;
        return button;
      };
      const updateButton = makeAction('update', '更新', 'secondary', 'M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3');
      const saveButton = makeAction('save', '保存', 'primary', 'M5 3h12l4 4v14H3V3h2M7 3v6h10V3M7 21v-7h10v7');
      const locationButton = makeAction('location', '打开文件位置', 'quiet', 'M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM12 11l3 3m0-3-3 3');
      actions.append(locationButton, updateButton, saveButton);
      tools.append(fileHint, actions);
      head.append(heading, tools);

      const toolbar = el('div', 'raw-toolbar');
      const tabs = el('div', 'raw-tabs');
      const previewTab = el('button', 'raw-tab active', '预览'); previewTab.type = 'button';
      const editTab = el('button', 'raw-tab', '编辑 Markdown'); editTab.type = 'button';
      tabs.append(previewTab, editTab);
      const status = el('div', 'raw-sync-status');
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      toolbar.append(tabs, status);
      const preview = el('div', 'raw-preview markdown-preview');
      preview.innerHTML = renderMarkdown(slide.raw);
      const editor = el('textarea', 'raw-editor');
      editor.rows = 12;
      editor.value = slide.raw || '';
      editor.setAttribute('aria-label', `${slide.label}原始材料 Markdown 编辑器`);

      const setMode = mode => {
        const editing = mode === 'edit';
        preview.style.display = editing ? 'none' : 'block';
        editor.style.display = editing ? 'block' : 'none';
        previewTab.classList.toggle('active', !editing);
        editTab.classList.toggle('active', editing);
        if (editing) editor.focus();
      };
      previewTab.addEventListener('click', () => setMode('preview'));
      editTab.addEventListener('click', () => setMode('edit'));

      const setStatus = (message, kind = '') => {
        status.textContent = message;
        status.dataset.state = kind;
      };
      const sourcePage = sourcePages[slide.id];
      if (!sourceDocumentAvailable) setStatus('请通过本地审阅服务打开决策板，启用源文档同步。', 'error');
      else if (rawDirty.has(slide.id)) setStatus(sourceFeedback[slide.id] || '有未保存更改：点击“保存”写回决策版本文档。', 'dirty');
      else if (sourcePage && sourcePage.raw !== slide.raw) setStatus('决策版本中的本页材料有更新，点击“更新”同步到决策板。', 'dirty');
      else setStatus(sourceFeedback[slide.id] || '原始材料按 Markdown 保存；预览和编辑内容均对应决策版本。');

      editor.addEventListener('input', () => {
        slide.raw = editor.value;
        state.raw_materials[slide.id] = editor.value;
        preview.innerHTML = renderMarkdown(editor.value);
        rawDirty.add(slide.id);
        sourceFeedback[slide.id] = '有未保存更改：点击“保存”写回决策版本文档。';
        setStatus(sourceFeedback[slide.id], 'dirty');
        const slideState = state.slides[slide.id];
        if (slideState.checked) {
          slideState.checked = false;
          slideState._checked_signature = null;
          renderNav();
        }
        queueDraft();
      });

      updateButton.addEventListener('click', async () => {
        if (rawDirty.has(slide.id) && !confirm('当前编辑区有未保存更改。更新会用决策版本中的内容覆盖编辑区，继续吗？')) return;
        updateButton.disabled = true;
        try {
          const data = await postJson('/api/source/refresh', { slideId: slide.id });
          const latestResponse = await fetch('/api/source-document', { cache: 'no-store' });
          if (latestResponse.ok) Object.assign(sourcePages, (await latestResponse.json()).pages || {});
          slide.raw = data.raw;
          state.raw_materials[slide.id] = data.raw;
          sourcePages[slide.id] = { raw: data.raw, pageHash: data.pageHash, outOfSync: false };
          rawDirty.delete(slide.id);
          sourceFeedback[slide.id] = '已从决策版本同步到决策板；请重新检查本页。';
          const slideState = state.slides[slide.id];
          slideState.checked = false; slideState._checked_signature = null;
          renderAll(false);
          queueDraft();
        } catch (error) { setStatus(error.message, 'error'); }
        finally { updateButton.disabled = false; }
      });

      saveButton.addEventListener('click', async () => {
        if (!sourceDocumentAvailable) return;
        saveButton.disabled = true;
        try {
          const data = await postJson('/api/source/save', {
            slideId: slide.id,
            raw: editor.value,
            expectedPageHash: sourcePages[slide.id]?.pageHash || ''
          });
          const latestResponse = await fetch('/api/source-document', { cache: 'no-store' });
          if (latestResponse.ok) Object.assign(sourcePages, (await latestResponse.json()).pages || {});
          slide.raw = data.raw;
          state.raw_materials[slide.id] = data.raw;
          sourcePages[slide.id] = { raw: data.raw, pageHash: data.pageHash, outOfSync: false };
          rawDirty.delete(slide.id);
          sourceFeedback[slide.id] = '已保存到决策版本文档；请重新检查本页。';
          const slideState = state.slides[slide.id];
          slideState.checked = false; slideState._checked_signature = null;
          renderAll(false);
          queueDraft();
        } catch (error) { setStatus(error.message, 'error'); }
        finally { saveButton.disabled = false; }
      });

      locationButton.addEventListener('click', async () => {
        locationButton.disabled = true;
        try {
          const data = await postJson('/api/source/open-location', {});
          setStatus(`已打开文件位置：${data.name}`);
        } catch (error) { setStatus(error.message, 'error'); }
        finally { locationButton.disabled = false; }
      });

      wrap.append(head, toolbar, preview, editor);
      return wrap;
    }

    let pendingUploads = 0;
    async function addFiles(slideId, assetId, fileList) {
      const files = Array.from(fileList || []).filter(file => !file.type || file.type.startsWith('image/'));
      if (!files.length) return;
      pendingUploads++;
      document.getElementById('saveStatus').textContent = '图片正在保存…';
      try {
        for (const file of files) {
          const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
          const response = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: file.name, type: file.type, data: dataUrl.split(',')[1] }) });
          const record = await response.json();
          if (!response.ok) throw new Error(record.error || '上传失败');
          state.slides[slideId].real_images[assetId].push(record);
          const target = state.slides[slideId];
          if (!target.real_image_role_explicit?.[assetId] && target.real_image_types[assetId] === 'skip') {
            const asset = slides.find(item => item.id === slideId)?.assets.find(item => item.id === assetId);
            const role = (asset?.roleOptions || imageTypes).find(item => item.id === 'evidence-schematic' || item.id === 'product-proof');
            if (role) target.real_image_types[assetId] = role.id;
          }
        }
      } catch (error) { alert('图片未保存：' + error.message + '。请通过本地服务打开网页后重试。'); }
      finally { pendingUploads--; renderAll(false); }
    }

    }

        s.locked_text = s.locked_text.includes(text) ? s.locked_text.filter(item => item !== text) : [...s.locked_text, text];
        renderAll(false);

      lockSection.appendChild(textChips);

    function currentDecision() {
      const palette = palettes.find(p => p.id === state.palette_direction) || palettes[0];
      const firstSlideId = slides[0]?.id || Object.keys(state.slides)[0];
      const first = state.slides[firstSlideId] || {};
      const decisionSlides = JSON.parse(JSON.stringify(state.slides));
      for (const slideState of Object.values(decisionSlides)) {
        normalizeGroupWeights(slideState);
        const excluded = (slideState.information_groups || []).filter(group => slideState.group_weights[group.id] === 'hidden');
        const excludedLabels = new Set(excluded.map(group => group.label));
        slideState.excluded_information_groups = excluded.map(({ id, label }) => ({ id, label }));
        slideState.required_section_titles = (slideState.required_section_titles || []).filter(title => !excludedLabels.has(title));
        slideState.locked_text = (slideState.locked_text || []).filter(text => !excludedLabels.has(text));
        slideState.custom_locked_text = (slideState.custom_locked_text || []).filter(text => !excludedLabels.has(text));
      }
      return {
        schema_version: 'visual_decision_board_v4_1',
        content_handling: state.content_handling,
        project: PROJECT_NAME,
        visual_direction: first.visual_direction,
        visual_strength: first.visual_strength,
        palette_direction: state.palette_direction,
        creative_extension_level: deriveCreativeExtensionLevel(first.visual_expressiveness),
        density: first.density,
        page_treatment: first.page_treatment,
        real_image_policy: 'skip_when_missing',
        global_palette: {
          category: paletteCategoryLabels[palette.category],
          palette_id: palette.id,
          palette_label: palette.label,
          colors: palette.colors,
          roles: palette.roles || {},
          source: palette.source || '',
          external_palette: palette.external_palette || null,
          color_system: palette.system_interpretation || null,
          notes: state.global_palette_notes
        },
        title_overlay: {
          mode: state.title_overlay,
          label: labelOf(globalControls.title_overlay, state.title_overlay),
          output_dir: 'final_image',
          note: state.title_overlay === 'no-title-reserved'
            ? '去标题版：不叠加主标题，但主体图必须保留标题安全区，最终图片仍保存到 final_image。'
            : '叠加标题版：生成主体图后使用本地标题样式叠加主标题。'
        },
        slides: decisionSlides,
        global_notes: state.global_notes,
        confirmed_at: new Date().toISOString()
      };
    }

    function removeLegacyPaletteFields(decision) {
      if (!decision || !decision.global_palette) return decision;
      LEGACY_GLOBAL_PALETTE_KEYS.forEach(key => delete decision.global_palette[key]);
      return decision;
    }

    function migrateLegacyDecision(decision) {
      if (!decision || typeof decision !== 'object') return null;
      const migrated = JSON.parse(JSON.stringify(decision));
      return removeLegacyPaletteFields(migrated);
    }

    let draftTimer;
    let draftQueue = Promise.resolve();
    let draftReady = false;
    function reviewSignature(slideState) {
      const { checked, _checked_signature, ...content } = slideState;
      return JSON.stringify(content);
    }
    function toggleChecked(slideState) {
      slideState.checked = !slideState.checked;
      slideState._checked_signature = slideState.checked ? reviewSignature(slideState) : null;
    }
    function queueDraft() {
      if (!draftReady) return;
      let reviewChanged = false;
      for (const slide of slides) {
        const s = state.slides[slide.id];
        if (s.checked && s._checked_signature && s._checked_signature !== reviewSignature(s)) { s.checked = false; reviewChanged = true; }
      }
      if (reviewChanged) renderNav();
      clearTimeout(draftTimer);
      document.getElementById('saveStatus').textContent = '草稿待保存…';
      draftTimer = setTimeout(() => {
        const snapshot = JSON.stringify(state);
        draftQueue = draftQueue.catch(() => {}).then(async () => {
          const response = await fetch('/api/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: snapshot });
          if (!response.ok) throw new Error('保存失败');
          const result = await response.json();
          document.getElementById('saveStatus').textContent = '草稿已保存 ' + new Date(result.savedAt).toLocaleTimeString();
        }).catch(() => { document.getElementById('saveStatus').textContent = '草稿保存失败，请检查连接'; });
      }, 600);
    }
    function updateOutput(show) {
      const output = document.getElementById('decisionOutput');
      queueDraft();
      output.value = JSON.stringify(currentDecision(), null, 2);
      output.style.display = show ? 'block' : 'none';
    }

    async function copyJson() {
      updateOutput(true);
      try {
        await navigator.clipboard.writeText(document.getElementById('decisionOutput').value);
        document.getElementById('saveStatus').textContent = 'JSON 已复制';
      } catch (error) {
        document.getElementById('saveStatus').textContent = '请手动复制 JSON';
      }
      updateOutput(false);
    }

    async function saveJson() {
      if (pendingUploads) { alert('图片正在保存，请稍候再提交。'); return; }
      if (rawDirty.size) {
        const firstDirtySlide = slides.find(slide => rawDirty.has(slide.id));
        if (firstDirtySlide) { state.active = firstDirtySlide.id; renderAll(true); }
        alert('本页原始材料还有未保存更改。请先点击右上角“保存”，再提交审阅，确保后续图片使用修改后的文字。');
        return;
      }
      if (!state.content_handling) { alert('请先在全局设置中选择原始内容处理方式。'); document.getElementById('globalPanel').scrollIntoView({ behavior: 'smooth' }); return; }
      const unchecked = slides.filter(slide => !state.slides[slide.id].checked).length;
      const checkedCount = slides.length - unchecked;
      if (!checkedCount) { alert("请至少标记一页已检查后再提交；只有已检查的页面会进入生成。"); return; }
      if (!confirm(`共 ${slides.length} 页：已检查 ${checkedCount} 页，未检查 ${unchecked} 页。此次仅生成已检查的 ${checkedCount} 页；其他页面不会生成。确认提交吗？`)) return;
      const skipped = slides.filter(slide => Object.entries(state.slides[slide.id].real_images).some(([id, images]) => images.length && state.slides[slide.id].real_image_types[id] === 'skip')).length;
      if (skipped && !confirm(`有 ${skipped} 页已上传图片，但图片用途为“暂不使用”。仍然提交吗？`)) return;
      updateOutput(true);
      try {
        const res = await fetch('/api/decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: document.getElementById('decisionOutput').value
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '保存失败');
        document.getElementById('saveStatus').textContent = '已保存';
        document.getElementById('modalTitle').textContent = '审阅已提交';
        document.getElementById('modalText').textContent = '你的选择和图片已保存。可以回到 Codex，继续生成页面方案。';
        document.getElementById('savedModal').classList.add('active');
        document.getElementById('closeModal').focus();
      } catch (error) {
        localStorage.setItem('ppt_visual_decision_v4_1', document.getElementById('decisionOutput').value);
        document.getElementById('saveStatus').textContent = '提交未完成';
        document.getElementById('modalTitle').textContent = '提交未完成';
        document.getElementById('modalText').textContent = '未能提交，请告知 Codex 检查审阅服务，或在会话中确认。';
        document.getElementById('savedModal').classList.add('active');
      }
      updateOutput(false);
    }

      document.querySelectorAll('#globalPanel h3, .side h3, #slidePanel .group-head h3, #slidePanel .mini-module h3').forEach(heading => {
        const label = heading.firstChild?.textContent?.trim();
        const path = icons[label];
        if (!path) return;
        const icon = document.createElement('span');
        icon.className = 'heading-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = `<svg viewBox="0 0 24 24">${path}</svg>`;
        heading.prepend(icon);
      });
    }

    function renderAll(scrollSlide) {
      renderGlobal();
      renderNav();
      renderGlobalSummary();
      renderSlide(scrollSlide);
      decorateHeadings();
      updateOutput(false);
    }

      initState();
      try {
        const response = await fetch('/api/draft');
        const draft = await response.json();
        if (draft.state && draft.state.slides) {
          for (const key of ['active', 'palette_category', 'palette_direction', 'title_overlay', 'content_handling', 'global_notes', 'global_palette_notes']) if (draft.state[key] !== undefined) state[key] = draft.state[key];
          if (draft.state.raw_materials && typeof draft.state.raw_materials === 'object') {
            state.raw_materials = { ...state.raw_materials, ...draft.state.raw_materials };
            for (const slide of slides) if (typeof state.raw_materials[slide.id] === 'string') {
              slide.raw = state.raw_materials[slide.id];
              if (sourcePages[slide.id] && sourcePages[slide.id].raw !== slide.raw) rawDirty.add(slide.id);
            }
          }
          for (const slide of slides) if (draft.state.slides[slide.id]) Object.assign(state.slides[slide.id], draft.state.slides[slide.id]);
          for (const slide of slides) normalizeGroupWeights(state.slides[slide.id]);
          if (!state.slides[state.active]) state.active = slides[0].id;
          document.getElementById('saveStatus').textContent = '已恢复未提交的草稿';
        } else if (draft.stale) document.getElementById('saveStatus').textContent = '页面已变化，旧草稿未恢复';
      } catch { document.getElementById('saveStatus').textContent = '草稿恢复不可用'; }
      try {
        const saved = localStorage.getItem('ppt_visual_decision_v4_1');
        if (saved) {
          const parsed = migrateLegacyDecision(JSON.parse(saved));
          if (parsed) {
            localStorage.setItem('ppt_visual_decision_v4_1', JSON.stringify(parsed, null, 2));
          }
        }
      } catch (error) {}
      renderAll(false);
      draftReady = true;
      document.getElementById('copyJson').addEventListener('click', copyJson);
      document.getElementById('saveJson').addEventListener('click', saveJson);
      document.getElementById('closeModal').addEventListener('click', () => { document.getElementById('savedModal').classList.remove('active'); document.getElementById('saveJson').focus(); });
    }

    bootstrap().catch(error => {
      document.getElementById('saveStatus').textContent = '加载失败';
      document.getElementById('modalText').textContent = error.message || '决策板加载失败';
      document.getElementById('savedModal').classList.add('active');
    });
  </script>
</body>
</html>
