<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT 视觉决策板 V4.1</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf7ff;
      --paper: #ffffff;
      --paper-2: #e5f0fb;
      --ink: #183452;
      --muted: #526f8b;
      --line: #bfd5e8;
      --accent: #247bee;
      --accent-soft: #eaf4ff;
      --accent-2: #5ab2e5;
      --dark: #174c89;
      --ok: #258078;
      --warn: #b16c27;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 9% 0%, #d7f2ff 0, transparent 35%), radial-gradient(circle at 95% 16%, #ddecff 0, transparent 33%), var(--bg); color: var(--ink); }
    button, input, textarea { font: inherit; }
    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .14s, box-shadow .14s, background .14s, border-color .14s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(30, 105, 183, .12); }
    button:active { transform: translateY(0); box-shadow: none; }
    h1, h2, h3, h4 { letter-spacing: 0; }
    h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.18; }
    h2 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.2;
      color: var(--ink);
    }
    h3 { margin: 0 0 10px; font-size: 19px; line-height: 1.25; }
    h4 { margin: 0 0 6px; font-size: 14px; line-height: 1.25; }
    p { margin: 5px 0; color: var(--muted); line-height: 1.48; font-size: 13px; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 14px 22px;
      background: rgba(246, 251, 255, .9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .primary { background: linear-gradient(135deg, #318cf4, #1769dc); color: white; padding: 11px 18px; font-weight: 800; box-shadow: 0 7px 16px rgba(36, 123, 238, .2); }
    .secondary, .quiet { border: 1px solid #91b6d6; background: #f7fbff; color: #174c89; padding: 10px 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(23, 76, 137, .08); }
    .secondary:hover, .quiet:hover { border-color: #5f9ed2; background: #e7f3ff; box-shadow: 0 3px 8px rgba(23, 76, 137, .13); }
    .page { max-width: 1480px; margin: 0 auto; padding: 24px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 12px 30px rgba(37, 105, 166, .07), 0 2px 8px rgba(37, 105, 166, .04);
      padding: 26px;
    }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--dark);
    }
    .section-title h2 { margin: 0; }
    .global-title h2 {
      margin-top: 2px;
      font-size: clamp(30px, 2.5vw, 42px);
      line-height: 1.06;
      letter-spacing: -0.03em;
      font-weight: 950;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--dark);
      color: #fff8ef;
      font-size: 12px;
      font-weight: 800;
    }
    .global-grid { display: grid; gap: 14px; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .custom-palette-card { border: 1px dashed #8e75bd; background: linear-gradient(135deg, #f4edff, #eaf2ff); }
    .custom-palette-card.selected { border-style: solid; }
    .custom-palette-action { min-width: 38px; min-height: 34px; font-size: 22px; line-height: 1; }
    .category-tabs {
      display: flex;
      gap: 10px;
      margin: 8px 0 14px;
      flex-wrap: wrap;
    }
    .category-tab {
      min-height: 42px;
      padding: 9px 16px;
      background: #eee7dd;
      color: var(--ink);
      font-weight: 900;
    }
    .category-tab.selected {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 18px rgba(200, 100, 43, .18);
    }
    .triad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .mini-module {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
    }
    .mini-module h3 { font-size: 15px; margin-bottom: 9px; }
    .wide-choice-module {
      margin-top: 10px;
    }
    .wide-choice-module .choice-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }
    .choice-row { display: grid; gap: 7px; }
    .choice {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #f6eee3;
      color: var(--ink);
      text-align: left;
    }
    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .choice strong { display: block; font-size: 13px; }
    .choice span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .card-option {
      min-height: 118px;
      padding: 12px;
      border: 1px solid var(--line);
      background: #fffaf1;
      color: var(--ink);
      text-align: left;
    }
    .card-option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(200, 100, 43, .14);
    }
    .swatches { display: flex; gap: 6px; margin: 8px 0; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: var(--ink);
      padding: 8px 10px;
    }
    textarea {
      min-height: 38px;
      height: 38px;
      line-height: 1.35;
      resize: vertical;
      overflow: auto;
      margin-top: 12px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 16px;
      margin-top: 16px;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      display: grid;
      gap: 12px;
    }
    .side .panel { padding: 16px; }
    .progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e2d8cc;
      margin: 10px 0 12px;
    }
    .progress span { display: block; height: 100%; width: 0%; background: var(--accent); }
    .nav-button {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr 10px;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      margin: 6px 0;
      padding: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink);
      text-align: left;
    }
    .nav-button.active { background: var(--accent-soft); border-color: rgba(200, 100, 43, .45); }
    .nav-index {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--dark);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }
    .nav-title { font-weight: 900; font-size: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
    .dot.ok { background: var(--ok); }
    .slide-panel { scroll-margin-top: 92px; }
    .slide-hero {
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2c261f, #4b3326);
      color: white;
    }
    .slide-hero h2 { color: white; font-size: 28px; margin: 0 0 6px; }
    .slide-hero p { color: rgba(255, 248, 239, .78); }
    .content-group {
      padding: 22px 0;
      border-top: 1px solid #e4dacf;
    }
    .content-group:first-of-type { border-top: 0; padding-top: 0; }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .raw-group-head { align-items: center; flex-wrap: wrap; gap: 10px 16px; }
    .raw-group-head h3 { margin: 0; }
    .raw-head-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; flex: 0 1 1020px; width: min(100%, 1020px); min-width: 0; margin-left: auto; align-items: center; gap: 8px 14px; padding: 10px 12px; border: 1px solid #c9e4d2; border-radius: 10px; background: #f2faf4; }
    .raw-file-details { display: grid; min-width: 0; max-width: 100%; gap: 3px; color: #527494; font-size: 12px; line-height: 1.45; }
    .raw-file-details span { min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .raw-actions { flex: 0 0 auto; }
    .raw-actions, .raw-tabs { display: flex; align-items: center; gap: 7px; }
    .raw-action { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 11px; font-size: 12px; font-weight: 700; }
    .raw-action.secondary { border: 1px solid #6b9bc2; background: #e9f3fc; color: #174c89; }
    .raw-action svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .raw-action:disabled { opacity: .48; cursor: not-allowed; transform: none; box-shadow: none; }
    .raw-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 10px 0 0; }
    .raw-tabs { margin: 0; }
    .raw-tab { border-radius: 7px 7px 0 0; padding: 7px 12px; background: transparent; color: #567895; box-shadow: none; }
    .raw-tab:hover { transform: none; background: #edf6ff; box-shadow: none; }
    .raw-tab.active { color: #155c9f; background: #e7f3ff; box-shadow: inset 0 -2px #2582df; }
    .raw-sync-status { min-height: 18px; margin: 0 0 0 auto; color: #527494; font-size: 12px; text-align: right; }
    .raw-sync-status[data-state="dirty"] { color: #986112; }
    .raw-sync-status[data-state="error"] { color: #b42318; }
    .raw-preview, .raw-editor { width: 100%; min-height: 208px; height: 260px; max-height: 65vh; margin-top: 8px; overflow: auto; resize: vertical; border: 1px solid #cbdff0; border-radius: 10px; background: #fff; padding: 13px 15px; color: #173c60; line-height: 1.65; }
    .raw-preview { display: block; }
    .raw-editor-wrap { position: relative; display: none; width: 100%; min-height: 208px; height: 260px; max-height: 65vh; margin-top: 8px; overflow: hidden; resize: vertical; border: 1px solid #cbdff0; border-radius: 10px; background: #fff; }
    .raw-editor-highlight, .raw-editor { position: absolute; inset: 0; box-sizing: border-box; width: 100%; height: 100%; margin: 0; padding: 13px 15px; border: 0; border-radius: inherit; font-family: ui-monospace, Consolas, "Microsoft YaHei UI", monospace; font-size: 13px; line-height: 1.65; tab-size: 2; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
    .raw-editor-highlight { overflow: hidden; color: #173c60; pointer-events: none; }
    .raw-editor-highlight mark { padding: 1px 0; border-radius: 3px; color: inherit; }
    .raw-editor-highlight mark[data-mode="replace"] { background: #d9f2e5; box-shadow: inset 0 -2px #38a169; }
    .raw-editor-highlight mark[data-mode="soften"] { background: #fff1cc; box-shadow: inset 0 -2px #d99a16; }
    .raw-editor-wrap .raw-editor { z-index: 1; display: block; min-height: 0; max-height: none; overflow: auto; resize: none; outline: 0; background: transparent; color: transparent; caret-color: #173c60; }
    .raw-editor-wrap .raw-editor::selection { background: rgba(57, 132, 219, .35); color: transparent; }
    .raw-mark-toolbar { display: none; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 7px; margin: 8px 0 0; }
    .raw-mark-toolbar.active { display: flex; }
    .raw-mark-toolbar button { min-height: 32px; padding: 6px 10px; border: 1px solid #c7d9e8; border-radius: 8px; background: #fff; color: #315f89; font-size: 12px; font-weight: 700; }
    .raw-mark-toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .raw-mark-toolbar .raw-mark-apply[data-mode="replace"] { border-color: #8cc8a5; background: #edf9f1; color: #216b3b; }
    .raw-mark-toolbar .raw-mark-apply[data-mode="soften"] { border-color: #e6c36a; background: #fff8e5; color: #8b6410; }
    .raw-mark-help { position: relative; }
    .raw-mark-help-popover { position: absolute; z-index: 5; top: calc(100% + 7px); right: 0; width: min(340px, calc(100vw - 48px)); padding: 12px 14px; border: 1px solid #cbdced; border-radius: 10px; background: #fff; color: #526f88; box-shadow: 0 8px 24px rgba(30,72,112,.15); font-size: 12px; line-height: 1.6; }
    .raw-mark-help-popover[hidden] { display: none; }
    .raw-mark-list { display: grid; gap: 6px; margin-top: 7px; }
    .raw-mark-list:empty { display: none; }
    .raw-mark-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 7px; background: #f3f7fa; color: #526f88; font-size: 11px; }
    .raw-mark-quote { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .raw-mark-item[data-mode="replace"] { background: #edf9f1; }
    .raw-mark-item[data-mode="soften"] { background: #fff8e5; }
    .raw-mark-item[data-stale="true"] { background: #fff1f0; color: #a63b32; }
    .raw-mark-mode { white-space: nowrap; font-weight: 700; }
    .raw-mark-remove { padding: 3px 7px; border: 0; border-radius: 5px; background: transparent; color: #71869a; cursor: pointer; }
    .raw-mark-remove:hover { background: #e5edf4; color: #315f89; }
    .generated-image-group { margin: 0 0 18px; padding: 16px; border: 1px solid #cbdced; border-radius: 14px; background: linear-gradient(150deg, #f9fbfe 0%, #eff5fb 100%); box-shadow: 0 8px 24px rgba(30, 72, 112, .07); }
    .generated-image-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .generated-image-head h3 { margin: 0; color: #173b5f; font-size: 18px; }
    .generated-image-subtitle { margin: 4px 0 0; color: #70869b; font-size: 12px; }
    .generated-image-count { flex: 0 0 auto; padding: 5px 10px; border: 1px solid #d7e5f1; border-radius: 999px; background: #fff; color: #54718e; font-size: 12px; font-weight: 700; }
    .generated-image-layout { display: grid; grid-template-columns: 168px minmax(0, 1fr); grid-template-rows: minmax(280px, 56vh) auto; gap: 12px 16px; align-items: stretch; min-height: 340px; }
    .generated-image-rail { min-width: 0; max-height: 66vh; overflow: auto; padding: 10px; border: 1px solid #d7e3ee; border-radius: 11px; background: rgba(255, 255, 255, .82); }
    .generated-image-rail-title { display: flex; justify-content: space-between; margin: 2px 2px 9px; color: #71879b; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .generated-image-version-list { display: grid; gap: 8px; }
    .generated-image-version { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 7px; align-items: center; width: 100%; padding: 6px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #314e69; text-align: left; box-shadow: none; }
    .generated-image-version:hover { transform: none; border-color: #c9d9e7; background: #f5f9fd; box-shadow: none; }
    .generated-image-version[aria-current="true"] { border-color: #91caff; background: #e6f4ff; box-shadow: none; }
    .generated-image-version-number { color: #7c8da0; font-size: 12px; text-align: center; }
    .generated-image-version[aria-current="true"] .generated-image-version-number { color: #0958d9; font-weight: 800; }
    .generated-image-thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid #d6e0e9; border-radius: 5px; background: #edf2f6; }
    .generated-image-stage { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 56vh; min-height: 280px; max-height: 680px; min-width: 0; gap: 9px; padding: 11px; border: 1px solid #d5e0ea; border-radius: 12px; background: #e9eff5; }
    .generated-image-stagebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; padding: 0 4px; }
    .generated-image-stage-name { overflow: hidden; color: #526d86; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .generated-image-open { flex: 0 0 auto; color: #2366a0; font-size: 12px; font-weight: 700; text-decoration: none; }
    .generated-image-open:hover { color: #174c89; text-decoration: underline; }
    .generated-image-canvas { display: grid; place-items: center; min-width: 0; min-height: 240px; overflow: hidden; padding: 18px; border: 1px solid #d2dce6; border-radius: 8px; background: #f8fafc; }
    .generated-image-preview { display: block; width: 100%; max-height: 78vh; object-fit: contain; border-radius: 4px; box-shadow: 0 8px 22px rgba(26, 47, 66, .18); }
    .generated-image-main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; gap: 10px; }
    .generated-image-details { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px 20px; min-width: 0; padding: 13px 15px; border: 1px solid #d7e3ee; border-radius: 11px; background: rgba(255, 255, 255, .88); }
    .generated-image-details[hidden] { display: none; }
    .generated-image-details-title { grid-column: 1 / -1; display: flex; align-items: center; gap: 7px; padding-bottom: 8px; border-bottom: 1px solid #e7edf3; color: #294c6c; font-size: 12px; font-weight: 800; }
    .page-flow-guide { background:#fff; }
    .page-flow-guide-content { gap:12px; }
    .page-flow-guide-section { padding:12px; border:1px solid #e3ebf2; border-radius:10px; background:#fff; }
    .page-flow-guide-section h4 { padding-bottom:7px; border-bottom:1px solid #edf1f5; color:#315f89; font-size:12px; }
    .page-flow-guide-row { grid-template-columns:minmax(0, 96px) minmax(0, 1fr); gap:5px 10px; margin-top:6px; padding:8px 9px; }
    .page-flow-guide-value { font-size:12px; }
    .page-flow-guide-effect { line-height:1.55; }
    .palette-modal-backdrop { position:fixed; inset:0; z-index:2000; display:none; place-items:center; padding:20px; background:#10243a80; }
    .palette-modal-backdrop.open { display:grid; }
    .palette-modal { width:min(100%, 460px); padding:22px; border-radius:14px; background:#fff; box-shadow:0 18px 60px #10243a55; }
    .palette-modal h3 { margin:0 0 14px; color:#173b5f; }
    .palette-modal label { display:block; margin:12px 0 5px; color:#506b84; font-size:12px; font-weight:700; }
    .palette-modal input, .palette-modal textarea, .palette-modal select { box-sizing:border-box; width:100%; padding:9px 10px; border:1px solid #cad8e5; border-radius:8px; font:inherit; }
    .palette-modal textarea { min-height:62px; resize:vertical; }
    .palette-color-row { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
    .palette-color-row input { height:42px; padding:4px; }
    .palette-modal-actions, .palette-custom-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .generated-image-detail-label { display: block; margin-bottom: 5px; color: #8395a5; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .generated-image-detail-value { display: block; color: #365875; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
    .generated-image-filepath { max-height: 120px; overflow: auto; padding: 8px; border-radius: 7px; background: #f1f5f9; color: #536d84; font-family: ui-monospace, Consolas, monospace; font-size: 10px; line-height: 1.5; user-select: text; }
    .generated-image-empty { grid-column: 1 / -1; align-self: center; margin: 0; color: #74899d; font-size: 13px; text-align: center; }
    .generated-image-group[data-state="empty"], .generated-image-group[data-state="loading"], .generated-image-group[data-state="error"] { padding: 12px 16px; }
    .generated-image-group[data-state="empty"] .generated-image-head, .generated-image-group[data-state="loading"] .generated-image-head, .generated-image-group[data-state="error"] .generated-image-head { margin-bottom: 8px; }

<body>
  <header>
    <div>
      <h1 id="boardTitle">PPT 视觉决策板 V4.1</h1>
    </div>
    <div class="top-actions">
      <span class="status-pill" id="saveStatus" role="status" aria-live="polite">未保存</span>
      <button class="secondary" id="copyJson" hidden>复制 JSON</button>
      <button class="primary" id="saveJson">保存全部决策</button>
    </div>
  </header>

  <div class="page">
    <section class="panel" id="globalPanel"></section>

    <section class="workspace">
      <aside class="side">
        <section class="panel">
          <h3>审阅进度</h3>
          <div class="progress"><span id="progressBar"></span></div>
          <p id="progressText">0 / 6 页已采用</p>
          <div id="slideNav"></div>
        </section>
        <section class="panel">
          <h3>全局摘要</h3>
          <ul class="risk-list" id="globalSummary"></ul>
        </section>
      </aside>

      <main id="slidePanel" class="slide-panel"></main>
    </section>
  </div>

  <textarea class="output" id="decisionOutput" spellcheck="false"></textarea>

  <div class="modal" id="savedModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle">审阅状态</h2>
      <p id="modalText">接下来可以生成 Master_Template.md 与 PPT_Page_Image_Guide.md。</p>
      <button class="primary" id="closeModal">知道了</button>
    </div>
  </div>

  <script src="./common-options.js"></script>
  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`未能加载脚本：${src}`));
        document.head.appendChild(script);
      });
    }

    async function loadBoardData() {
      const isFileMode = window.location.protocol === 'file:';
      if (isFileMode) {
        try {
          await loadScript('./board-inline-data.js');
          const inlineData = window.__BOARD_DATA__ || null;
          if (inlineData) return inlineData;
        } catch (error) {}
      } else {
        try {
          const response = await fetch('./board-data.json', { cache: 'no-store' });
          if (response.ok) return await response.json();
        } catch (error) {}
      }
      throw new Error('未能加载 board-data.json 或 board-inline-data.js');
    }

    function applyBoardMetadata(boardData) {
      const projectName = typeof boardData.projectName === 'string'
        ? boardData.projectName
        : (boardData.projectName?.title || boardData.projectName?.name || 'PPT 项目');
      const title = `${projectName} PPT 视觉决策板 V4.1`;
      document.title = title;
      const titleNode = document.getElementById('boardTitle');
      if (titleNode) titleNode.textContent = title;
      const progressNode = document.getElementById('progressText');
      if (progressNode) progressNode.textContent = `0 / ${boardData.slides.length} 页已采用`;
    }

    function cloneBoardData(boardData) {
      return JSON.parse(JSON.stringify(boardData));
    }

    async function bootstrap() {
      const loaded = await loadBoardData();
      const boardData = cloneBoardData(loaded);
      applyBoardMetadata(boardData);

      const PROJECT_NAME = typeof boardData.projectName === 'string'
        ? boardData.projectName
        : (boardData.projectName?.title || boardData.projectName?.name || 'PPT 项目');
      const palettes = boardData.palettes;
      const decisionBoardCommonOptions = window.__DECISION_BOARD_COMMON_OPTIONS__;
      if (!decisionBoardCommonOptions) {
        throw new Error('未能加载 common-options.js');
      }
      const {
        paletteCategoryLabels,
        globalControls,
        organizationOptions,
        commonOptions,
        weightOptions,
        emphasisMethods,
        imageTypes,
        legacyGlobalPaletteKeys: LEGACY_GLOBAL_PALETTE_KEYS
      } = decisionBoardCommonOptions;

      const slides = boardData.slides;
      const sourceDocument = boardData.sourceDocument || null;
      const sourcePages = {};
      const sourceFeedback = {};
      const imageSelections = new Map();
      const imageListFingerprints = new Map();
      let sourceFilePath = sourceDocument?.path || '';
      const rawDirty = new Set();
      let sourceDocumentAvailable = false;
      if (sourceDocument && window.location.protocol !== 'file:') {
        try {
          const response = await fetch('/api/source-document', { cache: 'no-store' });
          if (response.ok) {
            const data = await response.json();
            Object.assign(sourcePages, data.pages || {});
            sourceFilePath = data.path || sourceFilePath;
            sourceDocumentAvailable = true;
          }
        } catch (error) {}
      }

      const state = {
        active: boardData.initialActive || slides[0]?.id || 'slide01',
        palette_category: 'dark',
        palette_direction: 'deep-navy-signal-gold',
        custom_palette: null,
        title_overlay: 'overlay-title',
        content_handling: null,
        global_notes: '',
        global_palette_notes: '',
        raw_materials: Object.fromEntries(slides.map(slide => [slide.id, slide.raw])),
        slides: {}
      };

    function initState() {
      slides.forEach(slide => {
        const mode = commonOptions.page_mode.find(item => item.id === (slide.defaultMode || 'module-structure')) || commonOptions.page_mode[1];
        const groupWeights = Object.fromEntries(getInformationGroups(slide).map(group => [group.id, normalizeGroupWeight(group.defaultWeight || 'secondary')]));
        state.slides[slide.id] = {
          title: slide.title,
          page_mode: mode.id,
          primary_emphasis_method: slide.defaultPrimaryEmphasisMethod || 'reading-priority',
          visual_direction: slide.visualDirections[0].id,
          expression_mode: 'realistic-scene',
          visual_strength: mode.visual_strength,
          visual_restraint: 'cinematic',
          visual_expressiveness: slide.defaultVisualExpressiveness || 'polished-enhanced',
          expressive_mechanism: slide.defaultExpressiveMechanism || deriveExpressiveMechanism(slide, slide.defaultVisualExpressiveness || 'polished-enhanced'),
          density: mode.density,
          page_treatment: mode.page_treatment,
          information_groups: getInformationGroups(slide),
          group_weights: groupWeights,
          raw_visual_marks: [],
          checked: false,
          locked_text: [...slide.locked],
          custom_locked_text: [],
          section_title_candidates: [...slide.sectionTitles],
          required_section_titles: [...slide.sectionTitles],
          review_answers: Object.fromEntries(slide.questions.map(q => [q.id, q.choices[0]])),
          real_images: Object.fromEntries(slide.assets.map(a => [a.id, []])),
          real_image_types: Object.fromEntries(slide.assets.map(a => [a.id, 'skip'])),
          visual_direction_notes: '',
          density_notes: '',
          page_treatment_notes: '',
          design_notes: '',
          section_structure_notes: '',
          real_image_notes: '',
          page_notes: ''
        };
      });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function escapeMarkdownHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderMarkdownInline(value) {
      let text = escapeMarkdownHtml(value);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>');
      text = text.replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/_(.+?)_/g, '<em>$1</em>');
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return text;
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
      const html = [];
      const isBlockStart = line => /^\s*(?:#{1,6}\s|```|[-*+]\s|\d+[.)]\s|>\s?|(?:---+|\*\*\*+)\s*$)/.test(line);
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        const fence = line.match(/^\s*```\s*([\w-]*)/);
        if (fence) {
          const code = []; i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
          if (i < lines.length) i++;
          html.push(`<pre><code>${escapeMarkdownHtml(code.join('\n'))}</code></pre>`); continue;
        }
        const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) { const level = heading[1].length; html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`); i++; continue; }
        if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) { html.push('<hr>'); i++; continue; }
        if (i + 1 < lines.length && line.includes('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
          const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
          const headers = cells(line); i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
          const head = `<thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead>`;
          const body = `<tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody>`;
          html.push(`<table>${head}${body}</table>`); continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) items.push(`<li>${renderMarkdownInline(lines[i++].replace(/^\s*[-*+]\s+/, ''))}</li>`);
          html.push(`<ul>${items.join('')}</ul>`); continue;
        }
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(`<li>${renderMarkdownInline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`);
          html.push(`<ol>${items.join('')}</ol>`); continue;
        }
        if (/^\s*>/.test(line)) {
          const quote = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(renderMarkdownInline(lines[i++].replace(/^\s*>\s?/, '')));
          html.push(`<blockquote>${quote.join('<br>')}</blockquote>`); continue;
        }
        const paragraph = [line]; i++;
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i]) && !(lines[i].includes('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || ''))) paragraph.push(lines[i++]);
        html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
      }
      return html.join('');
    }

    async function postJson(url, body) {
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '操作失败');
      return result;
    }

    function getInformationGroups(slide) {
      if (slide.informationGroups && slide.informationGroups.length) return slide.informationGroups;
      return slide.sectionTitles.map((title, index) => ({
        id: 'section_' + index,
        label: title,
        defaultWeight: index === 0 ? 'primary' : 'secondary'
      }));
    }

    function normalizeGroupWeight(weight) {
      if (weight === 'unassigned') return 'unassigned';
      if (weight === 'supporting' || weight === 'light') return 'graphic';
      return weightOptions.some(option => option.id === weight) ? weight : 'secondary';
    }

    function extractContentGroupLabels(raw) {
      const lines = String(raw || '').replace(/^\uFEFF/, '').split(/\r?\n/);
      let sectionIndex = -1, sectionLevel = 0;
      for (let i = 0; i < lines.length; i++) {
        const match = lines[i].match(/^(#{1,6})\s*页面内容\s*#*\s*$/);
        if (match) { sectionIndex = i; sectionLevel = match[1].length; break; }
      }
      if (sectionIndex < 0) return ['页面内容'];
      const labels = [];
      const groupLevel = sectionLevel + 1;
      for (let i = sectionIndex + 1; i < lines.length; i++) {
        const heading = lines[i].match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (!heading) continue;
        const level = heading[1].length;
        if (level <= sectionLevel) break;
        if (level === groupLevel) labels.push(heading[2].replace(/\*\*/g, '').trim());
      }
      return [...new Set(labels.filter(Boolean))].length ? [...new Set(labels.filter(Boolean))] : ['页面内容'];
    }

    function normalizeGroupLabel(label) {
      return String(label || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase();
    }

    function groupIdForLabel(label, index, used) {
      const encoded = [...normalizeGroupLabel(label)].map(char => char.codePointAt(0).toString(36)).join('_').slice(0, 64) || 'section';
      let id = `raw_${encoded}`;
      let suffix = 2;
      while (used.has(id)) id = `raw_${encoded}_${suffix++}`;
      used.add(id);
      return id;
    }

    function contentGroupDiff(slide, slideState) {
      const current = slideState.information_groups || [];
      const labels = extractContentGroupLabels(slide.raw);
      const currentLabels = new Set(current.map(group => normalizeGroupLabel(group.label)));
      const sourceLabels = new Set(labels.map(normalizeGroupLabel));
      return {
        labels,
        added: labels.filter(label => !currentLabels.has(normalizeGroupLabel(label))),
        removed: current.filter(group => !sourceLabels.has(normalizeGroupLabel(group.label)))
      };
    }

    function syncContentGroups(slide, slideState) {
      const diff = contentGroupDiff(slide, slideState);
      const previous = slideState.information_groups || [];
      const oldWeights = slideState.group_weights || {};
      slideState.stale_information_groups ||= [];
      const usedIds = new Set(previous.map(group => group.id));
      const next = diff.labels.map((label, index) => {
        const key = normalizeGroupLabel(label);
        const exact = previous.find(group => normalizeGroupLabel(group.label) === key);
        const archivedIndex = slideState.stale_information_groups.findIndex(group => normalizeGroupLabel(group.label) === key);
        if (exact) return exact;
        if (archivedIndex >= 0) {
          const [archived] = slideState.stale_information_groups.splice(archivedIndex, 1);
          return { id: archived.id, label, defaultWeight: archived.weight === 'unassigned' ? 'secondary' : archived.weight, restoredWeight: archived.weight };
        }
        return { id: groupIdForLabel(label, index, usedIds), label, defaultWeight: 'secondary' };
      });
      const nextIds = new Set(next.map(group => group.id));
      previous.filter(group => !nextIds.has(group.id)).forEach(group => {
        if (!slideState.stale_information_groups.some(item => item.id === group.id)) {
          slideState.stale_information_groups.push({ id: group.id, label: group.label, weight: oldWeights[group.id] || group.defaultWeight || 'secondary' });
        }
      });
      const nextWeights = {};
      next.forEach(group => {
        const previousGroup = previous.find(item => item.id === group.id);
        if (previousGroup) nextWeights[group.id] = oldWeights[group.id] || group.defaultWeight || 'secondary';
        else if (group.restoredWeight) nextWeights[group.id] = group.restoredWeight;
        else nextWeights[group.id] = 'unassigned';
        delete group.restoredWeight;
      });
      slideState.information_groups = next;
      slideState.group_weights = nextWeights;
      slideState.section_title_candidates = [...diff.labels];
      slideState.required_section_titles = [...diff.labels];
      slideState.checked = false;
      slideState._checked_signature = null;
    }

    function normalizeGroupWeights(slideState) {
      slideState.group_weights ||= {};
      const hadLegacyWeight = Object.values(slideState.group_weights).some(weight => weight === 'supporting' || weight === 'light');
      for (const [groupId, weight] of Object.entries(slideState.group_weights)) {
        slideState.group_weights[groupId] = normalizeGroupWeight(weight);
      }
      for (const group of slideState.information_groups || []) {
        if (!slideState.group_weights[group.id]) slideState.group_weights[group.id] = normalizeGroupWeight(group.defaultWeight || 'secondary');
      }
      if (hadLegacyWeight && slideState.checked && slideState._checked_signature) slideState._checked_signature = reviewSignature(slideState);
    }

    function deriveExpressiveMechanism(slide, visualExpressiveness) {
      const text = [slide.title, slide.role, slide.summary, slide.raw, ...(slide.sectionTitles || [])].join(' ');
      if (/证据|数据|截图|参数|样本|对比|指标|表格|评测|验证/.test(text)) return 'evidence-wall';
      if (/流程|路径|链路|阶段|步骤|输入|输出|转化|闭环/.test(text)) return 'narrative-path';
      if (/系统|平台|控制|调度|座舱|监控|界面|后台/.test(text)) return 'system-cockpit';
      if (/差异|竞品|对照|缺口|前后|传统|自研|升级/.test(text)) return 'contrast-stage';
      if (/产品|设备|硬件|终端|模块|镜头|屏幕|引擎|算法/.test(text)) return visualExpressiveness === 'high-impact' ? 'hero-detail' : 'object-metaphor';

    async function refreshGeneratedImages(slide, wrap) {
      if (!wrap?.isConnected) return;
      try {
        const response = await fetch(`/api/generated-images?slideId=${encodeURIComponent(slide.id)}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('读取生成图片失败');
        const data = await response.json();
        if (!wrap.isConnected || state.active !== slide.id) return;
        const fingerprint = data.images.map(image => `${image.name}:${image.modifiedAt}:${image.kind}`).join('|');
        if (imageListFingerprints.get(slide.id) === fingerprint) return;
        imageListFingerprints.set(slide.id, fingerprint);
        const list = wrap.querySelector('.generated-image-version-list');
        const count = wrap.querySelector('.generated-image-count');
        const railCount = wrap.querySelector('.generated-image-rail-count');
        const empty = wrap.querySelector('.generated-image-empty');
        const oldSelection = imageSelections.get(slide.id);
        const imageElement = wrap.querySelector('.generated-image-preview');
        const openLink = wrap.querySelector('.generated-image-open');
        const details = wrap.querySelector('.generated-image-details');
        list.replaceChildren();
        if (!data.images?.length) {
          wrap.dataset.state = 'empty';
          imageElement.hidden = true;
          openLink.hidden = true;
          details.hidden = true;
          count.textContent = '0 个版本';
          railCount.textContent = '0';
          empty.textContent = '本页还没有生成图片；生成后会自动显示在这里。';
          return;
        }
        wrap.dataset.state = 'ready';
        count.textContent = `${data.images.length} 个版本`;
        railCount.textContent = String(data.images.length);
        const selectedUrl = data.images.some(image => image.url === oldSelection) ? oldSelection : data.preferred;
        imageSelections.set(slide.id, selectedUrl);
        empty.hidden = true;
        for (const image of data.images) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'generated-image-version';
          button.setAttribute('aria-current', String(image.url === selectedUrl));
          button.setAttribute('aria-label', `第 ${image.versionNumber} 版图片`);
          const versionNumber = document.createElement('span');
          versionNumber.className = 'generated-image-version-number';
          versionNumber.textContent = String(image.versionNumber);
          const thumb = document.createElement('img');
          thumb.className = 'generated-image-thumb';
          thumb.src = image.url;
          thumb.alt = '';
          thumb.loading = 'lazy';
          button.append(versionNumber, thumb);
          button.addEventListener('click', () => {
            imageSelections.set(slide.id, image.url);
            list.querySelectorAll('.generated-image-version').forEach(item => item.setAttribute('aria-current', String(item === button)));
            renderGeneratedImageSelection(wrap, image);
          });
          list.appendChild(button);
        }
        const selectedImage = data.images.find(image => image.url === selectedUrl);
        renderGeneratedImageSelection(wrap, selectedImage);
      } catch (error) {
        wrap.dataset.state = 'error';
        const empty = wrap.querySelector('.generated-image-empty');
        if (empty) { empty.hidden = false; empty.textContent = error.message; }
      }
    }

    let pendingUploads = 0;
    async function addFiles(slideId, assetId, fileList) {
      const files = Array.from(fileList || []).filter(file => !file.type || file.type.startsWith('image/'));
      if (!files.length) return;
      pendingUploads++;
      document.getElementById('saveStatus').textContent = '图片正在保存…';
      try {
        for (const file of files) {
          const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
          const response = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: file.name, type: file.type, data: dataUrl.split(',')[1] }) });
          const record = await response.json();
          if (!response.ok) throw new Error(record.error || '上传失败');
          state.slides[slideId].real_images[assetId].push(record);
          const target = state.slides[slideId];
          if (!target.real_image_role_explicit?.[assetId] && target.real_image_types[assetId] === 'skip') {
            const asset = slides.find(item => item.id === slideId)?.assets.find(item => item.id === assetId);
            const role = (asset?.roleOptions || imageTypes).find(item => item.id === 'evidence-schematic' || item.id === 'product-proof');
            if (role) target.real_image_types[assetId] = role.id;
          }
        }
      } catch (error) { alert('图片未保存：' + error.message + '。请通过本地服务打开网页后重试。'); }
      finally { pendingUploads--; renderAll(false); }
    }

    }

    function currentDecision() {
      const palette = selectedPalette();
      const firstSlideId = slides[0]?.id || Object.keys(state.slides)[0];
      const first = state.slides[firstSlideId] || {};
      const decisionSlides = JSON.parse(JSON.stringify(state.slides));
      for (const slideState of Object.values(decisionSlides)) {
        normalizeGroupWeights(slideState);
        const excluded = (slideState.information_groups || []).filter(group => slideState.group_weights[group.id] === 'hidden');
        const excludedLabels = new Set(excluded.map(group => group.label));
        slideState.excluded_information_groups = excluded.map(({ id, label }) => ({ id, label }));
        slideState.required_section_titles = (slideState.required_section_titles || []).filter(title => !excludedLabels.has(title));
        slideState.locked_text = (slideState.locked_text || []).filter(text => !excludedLabels.has(text));
        slideState.custom_locked_text = (slideState.custom_locked_text || []).filter(text => !excludedLabels.has(text));
      }
      return {
        schema_version: 'visual_decision_board_v4_1',
        content_handling: state.content_handling,
        project: PROJECT_NAME,
        visual_direction: first.visual_direction,
        visual_strength: first.visual_strength,
        palette_direction: state.palette_direction,
        creative_extension_level: deriveCreativeExtensionLevel(first.visual_expressiveness),
        density: first.density,
        page_treatment: first.page_treatment,
        real_image_policy: 'skip_when_missing',
        global_palette: {
          category: paletteCategoryLabels[palette.category],
          palette_id: palette.id,
          palette_label: palette.label,
          colors: palette.colors,
          roles: palette.roles || {},
          source: palette.source || '',
          external_palette: palette.external_palette || null,
          color_system: palette.system_interpretation || null,
          notes: state.global_palette_notes
        },
        title_overlay: {
          mode: state.title_overlay,
          label: labelOf(globalControls.title_overlay, state.title_overlay),
          output_dir: 'final_image',
          note: state.title_overlay === 'no-title-reserved'
            ? '去标题版：不叠加主标题，但主体图必须保留标题安全区，最终图片仍保存到 final_image。'
            : '叠加标题版：生成主体图后使用本地标题样式叠加主标题。'
        },
        slides: decisionSlides,
        global_notes: state.global_notes,
        confirmed_at: new Date().toISOString()
      };
    }

    function removeLegacyPaletteFields(decision) {
      if (!decision || !decision.global_palette) return decision;
      LEGACY_GLOBAL_PALETTE_KEYS.forEach(key => delete decision.global_palette[key]);
      return decision;
    }

    function migrateLegacyDecision(decision) {
      if (!decision || typeof decision !== 'object') return null;
      const migrated = JSON.parse(JSON.stringify(decision));
      return removeLegacyPaletteFields(migrated);
    }

    let draftTimer;
    let draftQueue = Promise.resolve();
    let draftReady = false;
    function reviewSignature(slideState) {
      const { checked, _checked_signature, ...content } = slideState;
      return JSON.stringify(content);
    }
    function toggleChecked(slideState) {
      slideState.checked = !slideState.checked;
      slideState._checked_signature = slideState.checked ? reviewSignature(slideState) : null;
    }
    function queueDraft() {
      if (!draftReady) return;
      let reviewChanged = false;
      for (const slide of slides) {
        const s = state.slides[slide.id];
        if (s.checked && s._checked_signature && s._checked_signature !== reviewSignature(s)) { s.checked = false; reviewChanged = true; }
      }
      if (reviewChanged) renderNav();
      clearTimeout(draftTimer);
      document.getElementById('saveStatus').textContent = '草稿待保存…';
      draftTimer = setTimeout(() => {
        const snapshot = JSON.stringify(state);
        draftQueue = draftQueue.catch(() => {}).then(async () => {
          const response = await fetch('/api/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: snapshot });
          if (!response.ok) throw new Error('保存失败');
          const result = await response.json();
          document.getElementById('saveStatus').textContent = '草稿已保存 ' + new Date(result.savedAt).toLocaleTimeString();
        }).catch(error => { document.getElementById('saveStatus').textContent = '草稿保存失败：' + (error.message || '请检查连接'); });
      }, 600);
    }
    function updateOutput(show) {
      const output = document.getElementById('decisionOutput');
      queueDraft();
      output.value = JSON.stringify(currentDecision(), null, 2);
      output.style.display = show ? 'block' : 'none';
    }

    async function copyJson() {
      updateOutput(true);
      try {
        await navigator.clipboard.writeText(document.getElementById('decisionOutput').value);
        document.getElementById('saveStatus').textContent = 'JSON 已复制';
      } catch (error) {
        document.getElementById('saveStatus').textContent = '请手动复制 JSON';
      }
      updateOutput(false);
    }

    async function saveJson() {
      if (pendingUploads) { alert('图片正在保存，请稍候再提交。'); return; }
      if (rawDirty.size) {
        const firstDirtySlide = slides.find(slide => rawDirty.has(slide.id));
        if (firstDirtySlide) { state.active = firstDirtySlide.id; renderAll(true); }
        alert('本页原始材料还有未保存更改。请先点击右上角“保存”，再提交审阅，确保后续图片使用修改后的文字。');
        return;
      }
      if (!state.content_handling) { alert('请先在全局设置中选择原始内容处理方式。'); document.getElementById('globalPanel').scrollIntoView({ behavior: 'smooth' }); return; }
      const skipped = slides.filter(slide => Object.entries(state.slides[slide.id].real_images).some(([id, images]) => images.length && state.slides[slide.id].real_image_types[id] === 'skip')).length;
      if (skipped && !confirm(`有 ${skipped} 页已上传图片，但图片用途为“暂不使用”。仍然提交吗？`)) return;
      updateOutput(true);
      try {
        const res = await fetch('/api/decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: document.getElementById('decisionOutput').value
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '保存失败');
        document.getElementById('saveStatus').textContent = '已保存';
        document.getElementById('modalTitle').textContent = '决策已保存';
        document.getElementById('modalText').textContent = '当前决策已保存。标记图片为候选即可确认该页。';
        document.getElementById('savedModal').classList.add('active');
        document.getElementById('closeModal').focus();
      } catch (error) {
        localStorage.setItem('ppt_visual_decision_v4_1', document.getElementById('decisionOutput').value);
        document.getElementById('saveStatus').textContent = '提交未完成';
        document.getElementById('modalTitle').textContent = '提交未完成';
        document.getElementById('modalText').textContent = '未能提交，请告知 Codex 检查审阅服务，或在会话中确认。';
        document.getElementById('savedModal').classList.add('active');
      }
      updateOutput(false);
    }

        '页面表达类型': '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
        '主重点表达方式': '<path d="m12 3 2.8 6.2L21 12l-6.2 2.8L12 21l-2.8-6.2L3 12l6.2-2.8z"/>',
        '信息组权重': '<path d="M4 19V9h4v10M10 19V5h4v14M16 19v-7h4v7"/>',
        '画面方案': '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 6-6 4 3 3-3 4 4"/>',
        '真实图片策略': '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m5 17 5-5 3 3 3-4 4 5"/>',
        '待审阅问题': '<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 18h.01"/>',
        '高级视觉设置': '<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',
        '必保小标题与锁定文本': '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
        '表达方式': '<path d="M4 18h16M5 14l5-5 4 3 5-6"/>',
        '呈现力度': '<path d="M3 19h18M5 15l4-4 3 2 6-8 2 2"/>',
        '视觉克制等级': '<path d="M12 3 4 7v5c0 5 3 8 8 9 5-1 8-4 8-9V7zM9 12l2 2 4-4"/>',
        '视觉表现力度': '<path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/>',
      };
      document.querySelectorAll('#globalPanel h3, .side h3, #slidePanel .group-head h3, #slidePanel .mini-module h3').forEach(heading => {
        const label = heading.firstChild?.textContent?.trim();
        const path = icons[label];
        if (!path) return;
        const icon = document.createElement('span');
        icon.className = 'heading-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = `<svg viewBox="0 0 24 24">${path}</svg>`;
        heading.prepend(icon);
      });
    }

    function renderAll(scrollSlide) {
      renderGlobal();
      renderNav();
      renderGlobalSummary();
      renderSlide(scrollSlide);
      decorateHeadings();
      updateOutput(false);
    }

      initState();
      try {
        const response = await fetch('/api/draft');
        const draft = await response.json();
        if (draft.state && draft.state.slides) {
          for (const key of ['active', 'palette_category', 'palette_direction', 'custom_palette', 'title_overlay', 'content_handling', 'global_notes', 'global_palette_notes']) if (draft.state[key] !== undefined) state[key] = draft.state[key];
          if (draft.state.raw_materials && typeof draft.state.raw_materials === 'object') {
            state.raw_materials = { ...state.raw_materials, ...draft.state.raw_materials };
            for (const slide of slides) if (typeof state.raw_materials[slide.id] === 'string') {
              slide.raw = state.raw_materials[slide.id];
              if (sourcePages[slide.id] && sourcePages[slide.id].raw !== slide.raw) rawDirty.add(slide.id);
            }
          }
          for (const slide of slides) if (draft.state.slides[slide.id]) Object.assign(state.slides[slide.id], draft.state.slides[slide.id]);
          for (const slide of slides) normalizeGroupWeights(state.slides[slide.id]);
          if (!state.slides[state.active]) state.active = slides[0].id;
          document.getElementById('saveStatus').textContent = '已恢复未提交的草稿';
        } else if (draft.stale) document.getElementById('saveStatus').textContent = '页面已变化，旧草稿未恢复';
      } catch { document.getElementById('saveStatus').textContent = '草稿恢复不可用'; }
      try {
        const saved = localStorage.getItem('ppt_visual_decision_v4_1');
        if (saved) {
          const parsed = migrateLegacyDecision(JSON.parse(saved));
          if (parsed) {
            localStorage.setItem('ppt_visual_decision_v4_1', JSON.stringify(parsed, null, 2));
          }
        }
      } catch (error) {}
      renderAll(false);
      draftReady = true;
      setInterval(() => {
        const activeSlide = slides.find(item => item.id === state.active);
        refreshGeneratedImages(activeSlide, document.querySelector('#slidePanel .generated-image-group'));
      }, 6000);
      document.getElementById('copyJson').addEventListener('click', copyJson);
      document.getElementById('saveJson').addEventListener('click', saveJson);
      document.getElementById('closeModal').addEventListener('click', () => { document.getElementById('savedModal').classList.remove('active'); document.getElementById('saveJson').focus(); });
    }

    bootstrap().catch(error => {
      document.getElementById('saveStatus').textContent = '加载失败';
      document.getElementById('modalText').textContent = error.message || '决策板加载失败';
      document.getElementById('savedModal').classList.add('active');
    });
  </script>
</body>
</html>
